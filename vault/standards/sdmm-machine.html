<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SDMM · The Machine — PTS-001 visual map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#070b09; --panel:#0c120e; --panel2:#0f1712;
    --line:rgba(61,255,160,.16); --line2:rgba(61,255,160,.34);
    --grn:#3dffa0; --grn-dim:#1e7a50;
    --amb:#ffb454; --cyn:#5ad7ff; --red:#ff5d5d;
    --txt:#d9e9de; --dim:#7d9a88; --faint:#48604f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'IBM Plex Mono', monospace; font-size:13px; line-height:1.5;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(61,255,160,.06), transparent),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.22) 3px 4px);
    min-height:100vh;
  }
  ::selection{background:rgba(61,255,160,.25);}
  .wrap{max-width:1460px; margin:0 auto; padding:28px 28px 90px;}

  /* ---------- header ---------- */
  header{border:1px solid var(--line); background:linear-gradient(180deg, var(--panel2), var(--panel)); padding:22px 26px 18px; position:relative; overflow:hidden; animation:rise .5s both;}
  header::after{content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg, transparent 0 80px, rgba(61,255,160,.025) 80px 81px); pointer-events:none;}
  .kicker{color:var(--grn); font-size:11px; letter-spacing:.22em; text-transform:uppercase;}
  h1{font-family:'Instrument Serif', serif; font-style:italic; font-weight:400; font-size:44px; line-height:1.02; margin:6px 0 4px; color:#eefaf2;}
  h1 .mono{font-family:'IBM Plex Mono',monospace; font-style:normal; font-size:26px; color:var(--grn); vertical-align:middle;}
  .sub{color:var(--dim); max-width:760px;}
  .statrow{display:flex; gap:26px; flex-wrap:wrap; margin-top:16px; padding-top:14px; border-top:1px dashed var(--line);}
  .stat b{display:block; color:var(--grn); font-size:19px; font-weight:600;}
  .stat span{color:var(--faint); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;}
  .legend{display:flex; gap:18px; flex-wrap:wrap; margin-top:14px; font-size:11px; color:var(--dim);}
  .legend i{font-style:normal; margin-right:6px;}

  /* ---------- layout ---------- */
  .cols{display:grid; grid-template-columns:minmax(0,1fr) 470px; gap:26px; margin-top:26px; align-items:start;}
  @media(max-width:1080px){ .cols{grid-template-columns:1fr;} .detail{position:static !important; max-height:none !important;} }

  /* ---------- pipeline ---------- */
  .cycleframe{border:1px dashed rgba(61,255,160,.3); position:relative; padding:34px 56px 28px 24px; cursor:pointer; transition:border-color .2s;}
  .cycleframe:hover{border-color:rgba(61,255,160,.55);}
  .cycleframe.sel{border-color:var(--grn); box-shadow:0 0 0 1px rgba(61,255,160,.25), 0 0 40px rgba(61,255,160,.06) inset;}
  .cyclelabel{position:absolute; top:-9px; left:18px; background:var(--bg); padding:0 10px; color:var(--grn); font-size:11px; letter-spacing:.2em;}
  .cyclelabel small{color:var(--faint); letter-spacing:.1em;}

  .band{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:4px;}
  @media(max-width:760px){.band{grid-template-columns:repeat(2,1fr);}}
  .band.two{grid-template-columns:repeat(2,1fr);}
  .chip{border:1px solid var(--line); background:var(--panel); padding:10px 12px; cursor:pointer; transition:.18s; position:relative; animation:rise .5s both;}
  .chip:hover{border-color:var(--line2); transform:translateY(-2px);}
  .chip.sel{border-color:var(--grn); box-shadow:0 0 14px rgba(61,255,160,.15);}
  .chip .t{font-size:12px; font-weight:600; color:var(--txt);}
  .chip .d{font-size:10.5px; color:var(--faint); margin-top:2px;}
  .chip.up{background:linear-gradient(180deg,#101a22,var(--panel)); border-color:rgba(90,215,255,.22);}
  .chip.up:hover{border-color:rgba(90,215,255,.45);}
  .chip.up.sel{border-color:var(--cyn); box-shadow:0 0 14px rgba(90,215,255,.15);}
  .bandlabel{font-size:10px; letter-spacing:.22em; color:var(--faint); text-transform:uppercase; margin:0 0 8px;}

  .rhythm{margin-top:10px; margin-bottom:4px; border:1px solid var(--line); background:var(--panel); padding:9px 14px; display:flex; align-items:center; gap:9px; font-size:10px; letter-spacing:.1em; color:var(--dim); cursor:pointer; overflow-x:auto; white-space:nowrap; transition:.18s; animation:rise .5s both;}
  .rhythm:hover{border-color:var(--line2); transform:translateY(-2px);}
  .rhythm.sel{border-color:var(--grn); box-shadow:0 0 14px rgba(61,255,160,.15);}
  .rhythm .rl{color:var(--faint); letter-spacing:.22em; margin-right:4px;}
  .rhythm b{color:var(--grn); font-weight:600;}
  .rhythm .arr{color:var(--faint);}
  .rhythm .loop{color:var(--amb); letter-spacing:.06em;}

  .node{border:1px solid var(--line); background:linear-gradient(180deg,var(--panel2),var(--panel)); padding:14px 16px; cursor:pointer; position:relative; transition:.18s; animation:rise .5s both;}
  .node:hover{border-color:var(--line2); transform:translateX(4px);}
  .node.sel{border-color:var(--grn); box-shadow:-4px 0 0 0 var(--grn), 0 0 24px rgba(61,255,160,.10);}
  .node .ch{position:absolute; top:-8px; right:12px; background:var(--bg); border:1px solid var(--line); color:var(--grn); font-size:9.5px; letter-spacing:.18em; padding:1px 8px;}
  .node h3{font-size:14px; font-weight:600; color:#eefaf2; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;}
  .node .role{color:var(--dim); font-size:11.5px; margin-top:3px;}
  .node .eqp{margin-top:8px; color:var(--grn); font-size:11.5px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .node.heart{border-color:rgba(61,255,160,.4); background:linear-gradient(180deg,#101d15,var(--panel));}
  .node.heart h3{font-size:16px;}
  .flag{font-size:10px; padding:1px 7px; border:1px solid; letter-spacing:.06em;}
  .flag.def{color:var(--amb); border-color:rgba(255,180,84,.4);}
  .flag.ext{color:var(--cyn); border-color:rgba(90,215,255,.4);}
  .flag.risk{color:var(--red); border-color:rgba(255,93,93,.4);}
  .flag.par{color:var(--grn); border-color:rgba(61,255,160,.35);}
  .flag.conf{color:#7ee2a8; border-color:rgba(126,226,168,.5); background:rgba(126,226,168,.06);}
  .flag.cut{color:var(--red); border-color:rgba(255,93,93,.4);}
  .node.descoped{opacity:.55;}
  .node.descoped h3 .nm{text-decoration:line-through; text-decoration-color:rgba(255,93,93,.7);}

  .conn{height:30px; width:100%; display:flex; justify-content:center; position:relative;}
  .conn::before{content:""; width:1px; background:repeating-linear-gradient(180deg, var(--grn) 0 5px, transparent 5px 11px); animation:flow 1.2s linear infinite; opacity:.55;}
  .conn::after{content:"▼"; position:absolute; bottom:-4px; color:var(--grn); font-size:8px; opacity:.7;}
  .conn.small{height:22px;}
  @keyframes flow{to{background-position:0 11px;}}

  /* feedback rail */
  .rail{position:absolute; top:120px; bottom:150px; right:14px; width:26px; border-top:1px dashed rgba(255,180,84,.5); border-right:1px dashed rgba(255,180,84,.5); border-bottom:1px dashed rgba(255,180,84,.5); border-radius:0 8px 8px 0; animation:railpulse 2.4s ease-in-out infinite; pointer-events:none;}
  .rail::before{content:"◀"; position:absolute; top:-7px; left:-8px; color:var(--amb); font-size:9px;}
  .rail::after{content:"FEEDBACK · fills → inventory → next cycle"; position:absolute; right:-14px; top:50%; transform:rotate(90deg) translateX(-50%); transform-origin:right top; color:var(--amb); font-size:9.5px; letter-spacing:.2em; white-space:nowrap; opacity:.8;}
  @keyframes railpulse{0%,100%{opacity:.45}50%{opacity:1}}

  .venue{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  @media(max-width:600px){.venue{grid-template-columns:1fr;}}

  .postrow{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:4px;}
  @media(max-width:900px){.postrow{grid-template-columns:1fr;}}

  /* ---------- detail panel ---------- */
  .detail{border:1px solid var(--line); background:var(--panel); position:sticky; top:20px; max-height:calc(100vh - 40px); overflow:auto; animation:rise .6s both;}
  .detail::-webkit-scrollbar{width:8px;} .detail::-webkit-scrollbar-thumb{background:var(--grn-dim);}
  .dhead{padding:16px 20px 12px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,var(--panel2),transparent); position:sticky; top:0; backdrop-filter:blur(4px); z-index:2;}
  .dhead .ch{color:var(--grn); font-size:10px; letter-spacing:.22em;}
  .dhead h2{font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; font-size:26px; color:#eefaf2; margin-top:2px;}
  .dbody{padding:16px 20px 26px; animation:fadein .25s both;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1;}}
  .sec{margin-bottom:18px;}
  .sec h4{font-size:10px; letter-spacing:.24em; color:var(--faint); text-transform:uppercase; margin-bottom:8px; border-bottom:1px dashed var(--line); padding-bottom:4px;}
  .sec p{color:var(--dim); font-size:12px; margin-bottom:6px;}
  .eqwrap{margin-bottom:10px;}
  .eq{background:#0a100c; border:1px solid var(--line); border-left:2px solid var(--grn); padding:8px 12px; color:var(--grn); font-size:12.5px; overflow-x:auto;}
  .eq small{display:block; color:var(--faint); font-size:10px; margin-top:2px; letter-spacing:.08em;}
  .sym{cursor:pointer; border-bottom:1px dotted rgba(61,255,160,.55); transition:.12s;}
  .sym:hover{background:rgba(61,255,160,.14);}
  .sym.act{background:rgba(255,180,84,.18); border-bottom-color:var(--amb); color:var(--amb);}
  .symlegend{border:1px solid var(--line); border-top:1px dashed rgba(61,255,160,.12); background:#080d0a; padding:7px 12px;}
  .symlegend .cap{font-size:9px; letter-spacing:.24em; color:var(--faint); text-transform:uppercase; margin-bottom:3px;}
  .symrow{display:flex; gap:10px; font-size:10.5px; color:var(--faint); padding:2.5px 4px; cursor:pointer; align-items:baseline; transition:.12s;}
  .symrow:hover{color:var(--dim);}
  .symrow b{color:var(--grn); min-width:48px; font-weight:500; flex-shrink:0;}
  .symrow.act{background:rgba(255,180,84,.08);}
  .symrow.act b{color:var(--amb);}
  .symrow.act span{color:var(--txt);}
  ul.plain{list-style:none;}
  ul.plain li{padding:3px 0 3px 16px; position:relative; color:var(--dim); font-size:12px;}
  ul.plain li::before{content:"▸"; position:absolute; left:0; color:var(--grn); font-size:10px; top:6px;}
  ul.plain li b{color:var(--txt); font-weight:500;}
  ul.warn li::before{content:"⚠"; color:var(--amb);}
  ul.warn li{color:#c9a071;}
  ul.warn li b{color:var(--amb);}
  .io{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .io .col h5{font-size:9.5px; color:var(--faint); letter-spacing:.2em; margin-bottom:4px;}
  .io .col div{font-size:11.5px; color:var(--dim); padding:2px 0;}
  table{width:100%; border-collapse:collapse; font-size:11px; margin-top:4px;}
  th,td{border:1px solid var(--line); padding:4px 8px; text-align:right; color:var(--dim);}
  th{color:var(--faint); font-weight:500; letter-spacing:.1em; font-size:9.5px;}
  td:first-child, th:first-child{text-align:left; color:var(--txt);}
  .seq{counter-reset:s;}
  .seq li{counter-increment:s; padding:4px 0 4px 30px; position:relative; color:var(--dim); font-size:12px; list-style:none;}
  .seq li::before{content:counter(s,decimal-leading-zero); position:absolute; left:0; color:var(--grn); font-size:10px; top:6px;}
  .hint{color:var(--faint); font-size:11px; font-style:italic;}

  footer{margin-top:30px; border-top:1px dashed var(--line); padding-top:14px; color:var(--faint); font-size:11px; display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap;}
  @keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
</style>

<script type="text/babel">

/* ═══════════════════ SYMBOL GLOSSARY ═══════════════════
   Global definitions. Individual equations can override any
   symbol (3rd element of the eq entry) where context differs. */
const SYM = {
  ESV:"Expected Settlement Value — the continuously re-estimated contractual value of one share. CTS-001's output; the number everything orbits",
  RP:"Reference Price — ESV published as the operational price anchor. RPₜ = ESVₜ by constitutional law",
  MOC:"Market Operating Condition — operational health class: Normal · Degraded · Protective · Recovery · Emergency",
  MOP:"Market Operations Profile — the target market shape: spread, displayed liquidity, depth, refresh, protection level",
  MLS:"Market Lifecycle State — Pre-IPO → IPO → Pre-Market → Open → Settlement → Archived (per security)",
  OLS:"Operational Lifecycle State — Pre-Game → Live → Post-Game → Weekly Report (per fixture, repeats all season)",
  PTS:"Product Technical Standard configuration — product-specific parameters layered on the constitutional rules",
  CFG:"engineering configuration — the SDMM's parameter set (much of it currently deferred / unwritten)",
  AOI:"Approved Operational Inputs — feed health, valuation availability, latency, system state, event status",
  EM:"Executable Market — internal object describing the complete liquidity environment for this cycle",
  PC:"Portfolio Capital — the finite (simulated) capital pool backing one portfolio (NFL and NCAA pools are separate)",
  PA:"Portfolio Assessment — portfolio-wide operational classification computed each cycle",
  PIR:"Portfolio Inventory Risk — aggregate inventory exposure measured against portfolio limits",
  PR:"Protection Requirements — the active protective constraints (highest-priority input everywhere)",
  PLB:"Portfolio Liquidity Budget — max aggregate liquidity deployable across all teams this cycle; never exceeds PC",
  ILB:"Issuer Liquidity Budget — one team's slice of the portfolio budget this cycle",
  A:"Portfolio Allocation Weight — a team's share of the pool. All weights sum to 1 (zero-sum). Formula deferred",
  BLB:"Bid-side Liquidity Budget — portion of a team's budget spendable on bids",
  OLB:"Offer-side Liquidity Budget — portion spendable on offers",
  EMS:"Effective Market State — the regime the engine has decided it is operating in",
  IRP:"Inventory Risk Profile — the active inventory limits / posture for the cycle",
  LB:"Liquidity Budget — the executable liquidity allowance (side-specific: Lᴮ bid / Lᴼ offer)",
  PP:"Pricing Profile — the active regime parameter set (Stable · Active · Defensive · Recovery · Liq-Preservation · Protective)",
  BO:"Bid Offset — total amount subtracted from RP to reach the reservation bid",
  OO:"Offer Offset — total amount added to RP to reach the reservation offer",
  BS:"bid-side Base Spread component — the profile's default half-spread on the bid side",
  OS:"offer-side Base Spread component — default half-spread on the offer side",
  IS:"Inventory Skew component — λ × INV. Widens the side you're already loaded on, shading prices to shed inventory",
  AS:"Activity Adjustment component — widens/tightens with order-flow intensity (formula deferred)",
  PS:"Protection Spread component — extra width applied under protective conditions (formula deferred)",
  INV:"Inventory Position — the SDMM's holdings expressed as a % of the team's publicly tradable float",
  "λ":"inventory sensitivity coefficient — the feedback gain; set per Effective Market State by the profile's I multiplier",
  "Δ":"ladder spacing — price gap between consecutive depth levels (Δᴮ bid side, Δᴼ offer side)",
  "ε":"bounded, seeded price randomization term — realism jitter that stays deterministic and replayable",
  k:"depth level index — k = 0 is the best bid/offer, higher k sits deeper in the book",
  N:"number of executable price levels in the ladder",
  W:"depth weight — the share of the side budget placed at level k. Weights sum to 1 per side",
  RBP:"Reservation Bid Price — RP − BO. The highest price the SDMM is willing to bid",
  ROP:"Reservation Offer Price — RP + OO. The lowest price it is willing to offer",
  RS:"Reservation Spread — ROP − RBP. An output of the process, never an independent target",
  MS:"Market Structure — the constructed bid and offer ladders (levels + spacing)",
  MP:"Market Posture — the current operating stance consumed by quantity/adaptation engines",
  DQ:"Displayed Quantity — the allocation of size across ladder levels",
  MA:"Market Adaptation function — maps environment → Behavioral Mode",
  IP:"Inventory Position — current holdings input to adaptation",
  BM:"Behavioral Mode — Normal · Active · Recovery · Liquidity Preservation · Protective",
  QC:"Quote Construction — final assembly of all engine outputs into one order book",
  EOB:"Executable Order Book — the complete published market for one team",
  EQ:"the currently published Executable Quotations",
  EX:"execution / partial-execution results — the fills that just happened",
  QA:"quote age — time or cycles since publication/refresh",
  QLF:"Quote Lifecycle Function — decides refresh / replace / replenish / cancel for each live quote",
  DR:"Deterministic Replay function — rebuilds a past cycle byte-identically from its records",
  CO:"Constitutional Objects — the recorded RP, MOC, MOP and lifecycle states of the original cycle",
  ES:"Engineering State — every engine output committed during the original cycle",
  PI:"Participant Interaction — the recorded order/fill history",
  VER:"implementation version — same code version required for identical replay",
  f:"unspecified function — the standard names the inputs but defers the methodology to config (ours/Edwin's to write)",
  t:"time — or equivalently, the current Decision Cycle",
  i:"team (issuer) index within the portfolio",
  Tick:"minimum price increment for the security",
};

/* wrap known symbols in clickable spans; only touches text between tags */
function annotate(html, dict){
  const keys = Object.keys(dict).sort((a,b)=>b.length-a.length);
  if(!keys.length) return {html, used:[]};
  const esc = s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const ascii = keys.filter(x=>/^[A-Za-z0-9]+$/.test(x)).map(esc);
  const other = keys.filter(x=>!/^[A-Za-z0-9]+$/.test(x)).map(esc);
  const parts=[];
  if(ascii.length) parts.push("\\b(?:"+ascii.join("|")+")\\b");
  if(other.length) parts.push("(?:"+other.join("|")+")");
  const re = new RegExp(parts.join("|"),"g");
  const used = new Set();
  const out = html.split(/(<[^>]+>)/g).map(seg=>{
    if(seg.startsWith("<")) return seg;
    return seg.replace(re, m=>{ used.add(m); return '<span class="sym" data-sym="'+m+'">'+m+'</span>'; });
  }).join("");
  return {html:out, used:[...used].sort((a,b)=>keys.indexOf(b)-keys.indexOf(a)).reverse()};
}

function Flags({f}){
  const map={def:["⚠ deferred math","def"],ext:["★ external dep","ext"],risk:["● open risk","risk"],par:["× per team","par"],conf:["✓ 20-07 confirmed","conf"],cut:["✂ descoped 20-07","cut"]};
  return <>{(f||[]).map(k=><span key={k} className={"flag "+map[k][1]}>{map[k][0]}</span>)}</>;
}

function Eq({e}){
  const [act,setAct]=useState(null);
  const dict = useMemo(()=>({...SYM, ...(e[2]||{})}),[e]);
  const ann = useMemo(()=>annotate(e[0],dict),[e,dict]);
  let html = ann.html;
  if(act) html = html.split('class="sym" data-sym="'+act+'"').join('class="sym act" data-sym="'+act+'"');
  const onClick = ev=>{ const s=ev.target && ev.target.getAttribute && ev.target.getAttribute("data-sym"); if(s) setAct(a=>a===s?null:s); };
  return (
    <div className="eqwrap">
      <div className="eq" onClick={onClick}>
        <span dangerouslySetInnerHTML={{__html:html}}/>
        <small>{e[1]}</small>
      </div>
      {ann.used.length>0 &&
        <div className="symlegend">
          <div className="cap">where — click any symbol above or below</div>
          {ann.used.map(s=>(
            <div key={s} className={"symrow"+(act===s?" act":"")} onClick={()=>setAct(a=>a===s?null:s)}>
              <b>{s}</b><span>{dict[s]}</span>
            </div>))}
        </div>}
    </div>);
}

      {n.notes && n.notes.length>0 && <div className="sec"><h4>Notes</h4>

        <ul className="plain warn">{n.deferred.map((x,i)=><li key={i} dangerouslySetInnerHTML={{__html:x}}/>)}</ul></div>}
    </div>);
}
